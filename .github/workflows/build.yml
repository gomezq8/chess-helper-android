# Builds the APK on every push to main and publishes it as a GitHub Release.
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Stockfish for Android (arm64). Uses the official release build; if that is
      # not available, compiles it with the Android NDK that the runner already has.
      - name: Get Stockfish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sf app/src/main/jniLibs/arm64-v8a
          BIN=""
          if gh release download -R official-stockfish/Stockfish --pattern '*android-armv8.tar' -D sf; then
            tar -xf sf/*.tar -C sf
            BIN=$(find sf -type f -name 'stockfish-android-armv8' | head -1)
          fi
          if [ -z "$BIN" ]; then
            echo "Release build not found, compiling with the NDK"
            git clone --depth 1 https://github.com/official-stockfish/Stockfish sfsrc
            export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
            make -C sfsrc/src -j4 build ARCH=armv8 COMP=ndk
            BIN=sfsrc/src/stockfish
          fi
          cp "$BIN" app/src/main/jniLibs/arm64-v8a/libstockfish.so
          ls -la app/src/main/jniLibs/arm64-v8a

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "chess-helper-1.0.${VERSION_CODE}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: مساعد الشطرنج 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: chess-helper-1.0.${{ github.run_number }}.apk
          make_latest: true
